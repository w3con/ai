name: Public candidate checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out public history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install declared Python dependency
        run: python3 -m pip install --disable-pip-version-check -r bin/requirements.txt

      - name: Install checksum-pinned Gitleaks
        run: |
          python3 bin/public-check install-gitleaks --destination "$RUNNER_TEMP/gitleaks-8.24.3"
          printf '%s\n' "$RUNNER_TEMP/gitleaks-8.24.3" >> "$GITHUB_PATH"

      - name: Run unit and isolated installation tests
        run: python3 -m unittest discover -s tests -v

      - name: Run hook contract suites
        run: |
          set -euo pipefail
          for test in hooks/*.test.py; do
            python3 "$test"
          done

      - name: Run reproducible no-network examples
        run: |
          examples/stamp-gate-drift.sh
          examples/working-copy-boundary.sh

      - name: Check the full public tree and history
        run: python3 bin/public-check check --root . --tree
